name: flutter_antigravity_starter_pack
description: "Flutter AI Starter — Riverpod 3, Dio, Freezed, GoRouter, secure storage."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

# Batas versi sengaja dibuat lebar agar Pub memilih versi terbaru yang cocok
# dengan Flutter SDK yang terpasang. scripts/setup.sh akan menjalankan
# `flutter pub upgrade --major-versions` bila resolusi gagal.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0
  # HTTP
  dio: ^5.8.0
  # Routing
  go_router: ">=16.0.0 <19.0.0"
  # Model immutable + JSON
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  # Penyimpanan
  shared_preferences: ^2.3.0
  flutter_secure_storage: ">=9.2.0 <12.0.0"
  # Logging
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  build_runner: ^2.4.15
  freezed: ">=3.0.0 <5.0.0"
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
